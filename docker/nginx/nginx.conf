# CivicPulse edge (spec §2, §8): the only container with published ports. HTTPS with the mkcert certificate.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  types { application/vnd.pmtiles pmtiles; }

  # Generous per-IP limits: at the defence every phone shares one Wi-Fi address (C11, B17).
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_status 429;

  # Never log query strings (SSE tickets or tokens must not land in logs, spec §8).
  log_format main '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log main;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;   # photo limit is 8 MB in config/civicpulse.yaml (B10)

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    # No inline scripts. Inline style attributes are needed by React and MapLibre; MapLibre runs its worker from a blob.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS is left off on purpose: the mkcert hostname is local (spec §8).

    root /usr/share/nginx/html;

    location /api/stream {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;          # Server-Sent Events must not be buffered
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }

    # `expires` (not add_header) so the security headers above are inherited by these locations.
    location /tiles/ {
      alias /srv/tiles/;            # pilot.pmtiles, read with HTTP range requests
      expires 1d;
    }

    location /assets/ {
      expires 1y;                   # file names carry a content hash
      try_files $uri =404;
    }

    location / {
      expires -1;                   # index.html is always revalidated
      try_files $uri /index.html;
    }
  }
}
